<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="IEC 60617 Symbol Library: diagrama unifilar y multifilar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182e"/>
      <stop offset="1" stop-color="#103a66"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <!-- Título -->
  <text x="60" y="100" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#e0f2fe">IEC 60617 Symbol Library</text>
  <text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#7dd3fc">Símbolos eléctricos SVG editables + DXF para CAD</text>
  <text x="60" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#94a3b8">SLD · MLD · baja y media tensión · IRAM 4502 / 4503</text>

  <!-- Barra principal -->
  <g filter="url(#glow)" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="60" y1="330" x2="1140" y2="330" stroke-width="8"/>
  </g>

  <!-- Alimentación desde barra (ACB) -->
  <g filter="url(#glow)" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="170" y1="330" x2="170" y2="300"/>
    <rect x="150" y="260" width="40" height="40" rx="3"/>
    <line x1="150" y1="260" x2="190" y2="300"/>
    <line x1="170" y1="260" x2="170" y2="220"/>
    <line x1="170" y1="200" x2="170" y2="200"/>
  </g>

  <!-- Contactor -->
  <g filter="url(#glow)" stroke="#7dd3fc" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="400" y1="330" x2="400" y2="290"/>
    <line x1="400" y1="290" x2="430" y2="240"/>
    <line x1="400" y1="220" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="400" y2="180"/>
    <line x1="385" y1="250" x2="415" y2="250" stroke-dasharray="4 4"/>
  </g>

  <!-- Transformador -->
  <g filter="url(#glow)" stroke="#38bdf8" stroke-width="3" fill="none">
    <circle cx="620" cy="250" r="26"/>
    <circle cx="620" cy="290" r="26"/>
    <line x1="620" y1="330" x2="620" y2="316"/>
    <line x1="620" y1="224" x2="620" y2="200"/>
  </g>

  <!-- Motor -->
  <g filter="url(#glow)" stroke="#a5f3fc" stroke-width="3" fill="none">
    <line x1="900" y1="330" x2="900" y2="290"/>
    <circle cx="900" cy="262" r="28"/>
    <text x="900" y="269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#a5f3fc" stroke="none" text-anchor="middle">M</text>
  </g>

  <!-- Protecciones y cables -->
  <g filter="url(#glow)" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round">
    <rect x="1040" y="262" width="60" height="28" rx="4"/>
    <line x1="1070" y1="330" x2="1070" y2="290"/>
    <line x1="1100" y1="330" x2="1100" y2="300"/>
  </g>

  <!-- Puntos de conexión -->
  <g fill="#f0abfc" filter="url(#glow)">
    <circle cx="170" cy="330" r="5"/>
    <circle cx="400" cy="330" r="5"/>
    <circle cx="620" cy="330" r="5"/>
    <circle cx="900" cy="330" r="5"/>
    <circle cx="1070" cy="330" r="5"/>
  </g>

  <!-- Etiquetas -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    <text x="170" y="376">ACB</text>
    <text x="400" y="376">KM</text>
    <text x="620" y="376">TR</text>
    <text x="900" y="376">MOT</text>
    <text x="1070" y="376">MCCB</text>
  </g>
</svg>
